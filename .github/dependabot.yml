version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them. The
  # references move together, in one pull request, since each names the same release (Д88 spec).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      shared-workflows:
        patterns: ["altnovatrail/.github/*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from, as in every Go repository of NovaTrail. Dependabot raises
  # none of spec's module, learner-model and engine: spec's module moves with the spec submodule, by
  # a move to its tag; learner-model and engine come by a task that holds the tag to the signed
  # release by release-verify, and the commits the bench is built on are the gate file's, which a
  # pull request of sim moves. The ecosystem stays all the same, as in every Go repository. Go
  # itself, in the Dockerfile, and the tools the recipes run by `go run` at an exact version are not
  # among them: those are raised by hand. Neither is .devcontainer/gopls/, the lock file of gopls:
  # its version goes up together with GOPLS_VERSION in the Dockerfile, by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: github.com/altnovatrail/spec
      - dependency-name: github.com/altnovatrail/learner-model
      - dependency-name: github.com/altnovatrail/engine
