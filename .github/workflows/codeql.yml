# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31
    # Go is read from a build, with the Go the toolchain stage of .devcontainer/Dockerfile pins in the
    # stage toolchain-core it is built from: the archive of its ARG GO_VERSION from go.dev, checked
    # against GO_SHA256_AMD64, without building the stage (R45 .github; R10, R68, R70).
    with:
      languages: go
