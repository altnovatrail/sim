# NovaTrail's shared release (R18 .github), pinned to a release of .github by SHA with its version
# beside it. RELEASE_LINE is the line the releases are numbered in; paths, what they are built
# from (R29 in docs/decisions.md). A commit of main whose CI has passed and which changes one of
# the paths since the release before it gets the next patch of the line, its tag and its one file,
# the archive of what builds and runs the gate, signed. The first release comes out always. The
# callers of the gate take sim from git by that tag and the SHA of its commit
# (docs/architecture.md, section 3.9).
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: altnovatrail/.github/.github/workflows/release.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21
    with:
      # What builds the bench and runs the gate, and what builds the release's file: the code but
      # its tests and their data, the packages and the paths it embeds, go.mod and go.sum, the
      # license, the gate file, the recipes, the toolchain and this workflow. Tests, their data and
      # the documents change no release.
      paths: |
        *.go
        :(exclude)*_test.go
        :(exclude,glob)**/testdata/**
        go.mod
        go.sum
        LICENSE
        .gitattributes
        gate.json
        justfile
        .devcontainer/Dockerfile
        internal/published/v*
        internal/criterion/paths.json
        .github/workflows/release.yml
