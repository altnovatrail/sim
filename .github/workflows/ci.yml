# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github; R10). id-token: write is
  # for its coverage job alone, which asks for an OIDC token: a called workflow can only lower what
  # this job gives it. With same-bits it holds the bits the same on every build too (R09;
  # docs/architecture.md, section 3.9): "Go / targets", "Go / fma-diff", "Go / arm64" on arm64
  # hardware, and "Go / rules", the rules of code by the tool of .github and the lists of
  # .github/coderules.json. The gate is not among them: it builds the bench on the commits of its
  # gate file and comes with a job of its own (R09).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21
    with:
      same-bits: true

  # The gate (R09, R26; docs/architecture.md, sections 3.7 and 3.9): the bench built on the commits
  # of gate.json through go.work, in the toolchain stage of sim's devcontainer, on amd64 and arm64.
  # Its own CI holds the numbers to the recorded ones to the last bit, so that the two architectures
  # give the same bits as each other and as the record; a caller holds them to their bands. The
  # caches of Go are kept between runs by the commits the gate builds on; the steps' times show the
  # gate cold and with the cache.
  gate:
    name: Gate / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: gate-${{ matrix.arch }}-${{ hashFiles('go.sum', 'gate.json', '.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile

      - name: gate
        run: |
          mkdir -p "$RUNNER_TEMP/go"
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOCACHE=/go/build --env GOMODCACHE=/go/mod \
              --volume "$RUNNER_TEMP/go:/go" \
              --volume "$PWD:/work" --workdir /work \
              toolchain just gate exact | tee -a "$GITHUB_STEP_SUMMARY"
